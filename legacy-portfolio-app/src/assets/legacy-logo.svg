<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" fill="none">
  <!-- Icon mark: square frame with diagonal arrow/chevron -->
  <rect x="4" y="4" width="72" height="72" rx="10" fill="#6F2DBD" />
  <!-- White chevron/arrow shape inside the mark -->
  <polyline points="18,58 34,30 50,48 66,22" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Diagonal slash accent lines -->
  <line x1="12" y1="52" x2="28" y2="18" stroke="rgba(255,255,255,0.28)" stroke-width="5" stroke-linecap="round"/>
  <line x1="52" y1="62" x2="68" y2="28" stroke="rgba(255,255,255,0.28)" stroke-width="5" stroke-linecap="round"/>

  <!-- LEGACY wordmark -->
  <text
    x="96"
    y="58"
    font-family="'Inter', 'Segoe UI', Arial, sans-serif"
    font-size="38"
    font-weight="800"
    letter-spacing="4"
    fill="#6F2DBD"
  >LEGACY</text>
</svg>
